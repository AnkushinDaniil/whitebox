  <text x="90" y="300" font-family="system-ui, sans-serif" font-size="76" font-weight="700" fill="#e7ecf3" letter-spacing="-2">Ethereum's execution layer,</text>
  <text x="90" y="390" font-family="system-ui, sans-serif" font-size="76" font-weight="700" fill="url(#g)" letter-spacing="-2">made transparent.</text>
  <text x="90" y="470" font-family="system-ui, sans-serif" font-size="30" fill="#aab4c5">Interactive, explorable explanations of the EL — for engineers.</text>
  <text x="90" y="560" font-family="monospace" font-size="22" fill="#6b7689">intuition → mechanism → spec &amp; code → go deeper</text>
