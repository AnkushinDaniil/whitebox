<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0c10"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bdcf0"/>
      <stop offset="0.7" stop-color="#82aaff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#1c4d5a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0a0c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(90, 110)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="none" stroke="#4cc9e6" stroke-width="4"/>
    <circle cx="22" cy="22" r="5" fill="#4cc9e6"/>
